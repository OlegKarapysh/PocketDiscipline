name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # The design-system step reads the baseline as it was on the base commit.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + design-system check)
        run: npm run lint

      - name: Design-system baseline may only shrink
        # A manual run has no base commit to compare against.
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-ui.mjs --baseline-against="$BASE_SHA"

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test -- --watch=false

      # Production build: fails on the bundle budgets in angular.json.
      - name: Build
        run: npm run build -- --base-href /PocketDiscipline/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/pocket-discipline/browser'

  # The tests tagged @smoke against the production build: one happy path per feature and the whole
  # layout audit. The full e2e suite is too slow for CI; run it locally with `npm run e2e`.
  e2e-smoke:
    name: Smoke tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cached browser still needs its system libraries, which live outside the cache.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      - name: Extract deployment build
        run: |
          mkdir -p dist/pocket-discipline/browser
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C dist/pocket-discipline/browser

      - name: Run smoke e2e tests
        run: npx playwright test -c e2e/playwright.smoke.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

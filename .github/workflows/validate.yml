name: Validate

on:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Also upload the tested build as the GitHub Pages artifact, for a deploy job that needs this workflow.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # The design-system step reads the baseline as it was on the base commit.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + design-system check)
        run: npm run lint

      - name: Design-system baseline may only shrink
        # A manual run has no base commit to compare against.
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD~1' }}
        run: node scripts/check-ui.mjs --baseline-against="$BASE_SHA"

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test -- --watch=false

  # The one build: the smoke job tests it and, when asked, the very same files become the Pages artifact.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Production build: fails on the bundle budgets in angular.json.
      - name: Build for GitHub Pages
        run: npm run build:pages

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: pages-build
          path: dist/pocket-discipline/browser
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/pocket-discipline/browser'

  # The tests tagged @smoke against the build above: one happy path per feature and the whole layout
  # audit. The full e2e suite is too slow for CI; run it locally with `npm run e2e`.
  e2e-smoke:
    name: Smoke tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cached browser still needs its system libraries, which live outside the cache.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: pages-build
          path: dist/pocket-discipline/browser

      - name: Run smoke e2e tests
        run: npx playwright test -c e2e/playwright.smoke.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

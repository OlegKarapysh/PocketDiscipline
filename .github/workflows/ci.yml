name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # The design-system step reads the baseline as it was on the base commit.
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Lint (ESLint + design-system check)
      run: npm run lint

    - name: Design-system baseline may only shrink
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: node scripts/check-ui.mjs --baseline-against="$BASE_SHA"
      
    - name: Run Unit Tests
      run: npm run test -- --watch=false
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      
    - name: Run Playwright E2E tests
      run: npm run e2e
      
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

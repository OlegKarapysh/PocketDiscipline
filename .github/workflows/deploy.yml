name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize validation and deployment; never cancel an active production run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validation
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml

  deploy:
    name: GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

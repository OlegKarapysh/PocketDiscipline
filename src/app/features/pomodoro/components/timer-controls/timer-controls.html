<div class="controls">
  @if (!isActive()) {
    <button mat-fab color="primary" (click)="start()" aria-label="Start Timer">
      <mat-icon>play_arrow</mat-icon>
    </button>
  } @else {
    <button mat-fab color="warn" (click)="stop()" aria-label="Stop Timer">
      <mat-icon>stop</mat-icon>
    </button>
  }
</div>

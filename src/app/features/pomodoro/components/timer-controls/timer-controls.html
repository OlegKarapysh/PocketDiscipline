<div class="controls">
  @if (!isActive()) {
    <button mat-fab type="button" [disabled]="isRestoring()" (click)="start()" aria-label="Start Timer">
      <mat-icon>play_arrow</mat-icon>
    </button>
  } @else {
    <button mat-fab class="stop" type="button" (click)="stop()" aria-label="Stop Timer">
      <mat-icon>stop</mat-icon>
    </button>
  }
</div>

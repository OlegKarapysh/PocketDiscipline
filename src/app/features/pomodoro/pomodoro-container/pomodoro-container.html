<app-page-header title="Pomodoro" />
<div class="columns">
  <div class="column">
    <app-section-card>
      <app-timer-display />
      <app-session-config />
      <app-timer-controls />
    </app-section-card>
    <app-pomodoro-today [tally]="todaySummary()?.total" />
  </div>
  <app-pomodoro-history
    class="column"
    [summary]="historySummary()"
    [filter]="currentFilter()"
    (filterChange)="onFilterChange($event)"
  />
</div>

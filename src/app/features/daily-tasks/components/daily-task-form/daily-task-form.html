<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>New daily task</mat-card-title>
  </mat-card-header>

  <mat-card-content class="form-content">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Title</mat-label>
      <input
        matInput
        type="text"
        [formField]="taskForm.title"
        (keydown.enter)="submit()"
        placeholder="e.g. Morning Workout"
      />
    </mat-form-field>

    <div class="difficulties-section">
      <h4 class="section-title">Difficulties</h4>
      @for (diff of draft().difficulties; track diff.id; let i = $index) {
        <div class="difficulty-row">
          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="diff-name">
            <mat-label>Name</mat-label>
            <input matInput type="text" [formField]="taskForm.difficulties[i].name" placeholder="e.g. Easy" />
          </mat-form-field>

          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="diff-reward">
            <mat-label>Reward</mat-label>
            <input matInput type="number" [formField]="taskForm.difficulties[i].baseReward" placeholder="Reward" />
          </mat-form-field>

          <button
            mat-icon-button
            class="remove"
            (click)="removeDifficulty(i)"
            [disabled]="!canRemoveDifficulty()"
            aria-label="Remove difficulty"
            type="button"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      }
      <button mat-stroked-button type="button" (click)="addDifficulty()">
        <mat-icon>add</mat-icon> Add difficulty
      </button>
    </div>
  </mat-card-content>

  <mat-card-actions align="end" class="actions">
    <button mat-button type="button" (click)="cancelForm.emit()">Cancel</button>
    <button mat-flat-button type="button" class="save" [disabled]="!canSubmit()" (click)="submit()">Save task</button>
  </mat-card-actions>
</mat-card>

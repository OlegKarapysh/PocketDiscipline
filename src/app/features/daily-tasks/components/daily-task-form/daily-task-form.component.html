<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Add New Daily Task</mat-card-title>
  </mat-card-header>

  <mat-card-content class="form-content">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Title</mat-label>
      <input matInput type="text" [(ngModel)]="title" placeholder="e.g. Morning Workout" />
    </mat-form-field>

    <div class="difficulties-section">
      <h4 class="section-title">Difficulties</h4>
      @for (diff of difficulties; track diff; let i = $index) {
        <div class="difficulty-row">
          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="diff-name">
            <mat-label>Name</mat-label>
            <input matInput type="text" [(ngModel)]="diff.name" placeholder="e.g. Easy" />
          </mat-form-field>

          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="diff-reward">
            <mat-label>Reward</mat-label>
            <input matInput type="number" [(ngModel)]="diff.baseReward" placeholder="Reward" />
          </mat-form-field>

          <button
            mat-icon-button
            color="warn"
            (click)="removeDifficulty(i)"
            [disabled]="difficulties.length === 1"
            aria-label="Remove difficulty"
            type="button"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      }
      <button mat-stroked-button color="primary" type="button" (click)="addDifficulty()">
        <mat-icon>add</mat-icon> Add Difficulty
      </button>
    </div>
  </mat-card-content>

  <mat-card-actions align="end" class="actions">
    <button mat-button type="button" (click)="cancelForm.emit()">Cancel</button>
    <button mat-flat-button color="primary" type="button" [disabled]="!title" (click)="submit()">
      Save Task
    </button>
  </mat-card-actions>
</mat-card>

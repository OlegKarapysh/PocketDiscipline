<div class="form-container">
  <h3>Add New Daily Task</h3>

  <div class="form-group">
    <label for="taskTitle">Title:</label>
    <input id="taskTitle" type="text" [(ngModel)]="title" placeholder="e.g. Morning Workout" />
  </div>

  <div class="difficulties-section">
    <h4>Difficulties</h4>
    @for (diff of difficulties; track diff; let i = $index) {
      <div class="difficulty-row">
        <input type="text" [(ngModel)]="diff.name" placeholder="Name (e.g. Easy)" />
        <input type="number" [(ngModel)]="diff.baseReward" placeholder="Reward" />
        <button type="button" class="btn-remove" (click)="removeDifficulty(i)" [disabled]="difficulties.length === 1">
          Remove
        </button>
      </div>
    }
    <button type="button" class="btn-add" (click)="addDifficulty()">+ Add Difficulty</button>
  </div>

  <div class="actions">
    <button (click)="cancelForm.emit()">Cancel</button>
    <button class="btn-primary" [disabled]="!title" (click)="submit()">Save Task</button>
  </div>
</div>

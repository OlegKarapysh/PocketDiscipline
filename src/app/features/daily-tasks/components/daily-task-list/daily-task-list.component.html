<div class="daily-tasks-container">
  <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem">
    <h2 style="margin: 0">Daily Tasks</h2>
    @if (!showForm) {
      <button (click)="showForm = true" class="btn-add" style="padding: 0.5rem 1rem; cursor: pointer">
        + Add Daily Task
      </button>
    }
  </div>

  @if (showForm) {
    <app-daily-task-form (taskCreated)="onTaskCreated($event)" (cancelForm)="showForm = false"> </app-daily-task-form>
  }

  @if (tasks$ | async; as tasks) {
    <div class="task-list">
      @for (task of tasks; track task) {
        <app-daily-task-item [task]="task" (complete)="onCompleteTask(task, $event)"> </app-daily-task-item>
      }
      @if (tasks.length === 0) {
        <div class="empty-state">No daily tasks configured yet.</div>
      }
    </div>
  }
</div>

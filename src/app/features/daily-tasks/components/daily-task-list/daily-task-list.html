<section class="daily-tasks">
  <div class="header">
    <h2 class="title">Daily tasks</h2>
    @if (!showForm()) {
      <button matButton="tonal" type="button" class="add" (click)="openForm()">
        <mat-icon>add</mat-icon> Add daily task
      </button>
    }
  </div>

  @if (showForm()) {
    <app-daily-task-form (taskCreated)="onTaskCreated($event)" (cancelForm)="closeForm()" />
  }

  @if (tasks(); as tasks) {
    <div class="task-list">
      @for (task of tasks; track task.id) {
        <app-daily-task-item [task]="task" (complete)="onCompleteTask(task, $event)" />
      } @empty {
        <app-empty-state heading="No daily tasks yet" message="Add one small thing you want to do every day." />
      }
    </div>
  }
</section>

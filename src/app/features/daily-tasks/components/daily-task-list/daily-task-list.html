<section class="daily-tasks">
  <div class="header">
    <h2 class="title">Daily tasks</h2>
    @if (!showForm()) {
      <button matButton="tonal" type="button" class="add" (click)="openForm()">
        <mat-icon>add</mat-icon> Add daily task
      </button>
    }
  </div>

  @if (showForm()) {
    <app-daily-task-form [saving]="saving()" (save)="onTaskCreated($event)" (cancelForm)="closeForm()" />
  }

  @if (tasks(); as tasks) {
    <div class="task-list">
      @for (row of rows(); track row.task.id) {
        @if (editingTaskId() === row.task.id) {
          <app-daily-task-form
            [task]="row.task"
            [saving]="saving()"
            (save)="onTaskEdited(row.task, $event)"
            (cancelForm)="closeEdit()"
            (delete)="confirmDelete(row.task)"
          />
        } @else {
          <app-daily-task-item
            [task]="row.task"
            [completed]="row.done"
            [expanded]="expandedTaskId() === row.task.id"
            (expandedChange)="setExpanded(row.task, $event)"
            (complete)="onCompleteTask(row.task, $event)"
            (edit)="openEdit($event)"
          />
        }
      } @empty {
        <app-empty-state heading="No daily tasks yet" message="Add one small thing you want to do every day." />
      }
    </div>
  }
</section>

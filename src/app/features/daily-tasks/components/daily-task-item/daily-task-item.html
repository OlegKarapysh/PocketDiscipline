<mat-card appearance="outlined" class="task-card" [class.completed]="isCompletedToday()">
  <div class="header">
    @if (isCompletedToday()) {
      <span class="done-icon">
        <mat-icon class="pd-icon-filled" aria-hidden="false" aria-label="Completed today">check_circle</mat-icon>
      </span>
    }
    <div class="titles">
      <span class="title">{{ task().title }}</span>
      @if (task().streak > 0) {
        <app-streak-badge [days]="task().streak" />
      }
    </div>
    <div class="item-actions">
      <button mat-icon-button type="button" (click)="edit.emit(task())" aria-label="Edit daily task">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button type="button" class="delete" (click)="delete.emit(task())" aria-label="Delete daily task">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </div>

  @if (!isCompletedToday()) {
    <div class="actions">
      @for (diff of task().difficulties; track diff.id) {
        <button mat-stroked-button class="pd-difficulty" type="button" (click)="complete.emit(diff)">
          {{ diff.name }}
          <app-amount [value]="diff.baseReward" size="sm" tone="reward" [showSign]="true" />
        </button>
      }
    </div>
  }
</mat-card>

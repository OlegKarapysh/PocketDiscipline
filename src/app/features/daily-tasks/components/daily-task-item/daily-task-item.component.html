<div class="task-item" [class.completed]="isCompletedToday">
  <div class="header">
    <h3>{{ task.title }}</h3>
    @if (task.streak > 0) {
      <span class="streak-badge" title="Current streak"> 🔥 {{ task.streak }} Day Streak </span>
    }
  </div>
  @if (!isCompletedToday) {
    <div class="actions">
      @for (diff of task.difficulties; track diff) {
        <button (click)="complete.emit(diff)">{{ diff.name }} (+{{ diff.baseReward }})</button>
      }
    </div>
  }
  @if (isCompletedToday) {
    <div class="completed-msg">Completed for today!</div>
  }
</div>

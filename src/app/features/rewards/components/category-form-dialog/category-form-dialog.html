<h2 mat-dialog-title>{{ isEdit ? 'Edit category' : 'Add new category' }}</h2>

<mat-dialog-content>
  <div class="category-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Category name</mat-label>
      <input matInput [formField]="categoryForm.name" placeholder="e.g. Fitness, Hobbies, Gaming" />
      @for (error of categoryForm.name().errors(); track error.kind) {
        <mat-error>{{ error.message }}</mat-error>
      }
    </mat-form-field>

    <div class="selection-section">
      <span class="section-label">Select color</span>
      <div class="color-picker-row">
        @for (color of presetColors; track color) {
          <button
            type="button"
            class="color-chip"
            [style.backgroundColor]="color"
            [class.selected]="model().color === color"
            [attr.aria-pressed]="model().color === color"
            (click)="selectColor(color)"
            [attr.aria-label]="'Select color ' + color"
          >
            @if (model().color === color) {
              <mat-icon class="check-icon">check</mat-icon>
            }
          </button>
        }
      </div>
    </div>

    <div class="selection-section">
      <span class="section-label">Select icon</span>
      <div class="icon-picker-row">
        @for (icon of presetIcons; track icon) {
          <button
            type="button"
            class="icon-chip"
            [class.selected]="model().icon === icon"
            [attr.aria-pressed]="model().icon === icon"
            [style.backgroundColor]="model().icon === icon ? model().color : null"
            (click)="selectIcon(icon)"
            [attr.aria-label]="'Select icon ' + icon"
          >
            <mat-icon>{{ icon }}</mat-icon>
          </button>
        }
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancel</button>
  <button
    mat-flat-button
    type="button"
    class="submit-button"
    (click)="onSubmit()"
    [disabled]="categoryForm().invalid()"
  >
    {{ isEdit ? 'Save changes' : 'Create category' }}
  </button>
</mat-dialog-actions>

<div class="spending-analytics">
  <app-segmented-control
    class="period-filter"
    [options]="periodOptions"
    [(value)]="selectedPeriod"
    ariaLabel="Select analytics timeframe"
  />

  <div class="metrics-grid">
    <app-stat-card label="Total spent">
      <app-amount [value]="analytics().totalSpent" />
    </app-stat-card>

    <app-stat-card label="Withdrawals">
      <span class="metric-count">{{ analytics().withdrawalCount }}</span>
    </app-stat-card>

    <app-stat-card label="Top category" [hint]="topCategoryShare()">
      <span class="metric-text">{{ topCategory()?.categoryName ?? 'None' }}</span>
    </app-stat-card>

    <app-stat-card label="Average per spend">
      <app-amount [value]="averagePerWithdrawal()" />
    </app-stat-card>
  </div>

  @if (analytics().totalSpent === 0) {
    <app-empty-state
      heading="No spending data in this period"
      message="Log a quick spend or claim a reward in the store to see where your balance goes."
    />
  } @else {
    <div class="charts-grid">
      <app-section-card heading="Category breakdown">
        <p class="chart-subtitle">Withdrawals by category</p>
        <app-spending-donut-chart [data]="analytics().categoryBreakdown" [totalSpent]="analytics().totalSpent" />
      </app-section-card>

      <app-section-card heading="Spending trend">
        <p class="chart-subtitle">{{ trendSubtitle() }}</p>
        <app-spending-trend-chart [data]="analytics().spendingTrend" [granularity]="analytics().granularity" />
      </app-section-card>
    </div>
  }
</div>

<app-page-header title="Categories" eyebrow="Rewards">
  <button pageActions mat-flat-button type="button" (click)="openAddCategoryDialog()" class="add-category-button">
    <mat-icon>add</mat-icon>
    Add category
  </button>
</app-page-header>

<div class="category-management">
  <p class="intro">Organize your rewards and expense withdrawals with custom categories.</p>

  <div class="category-list">
    @for (category of categories(); track category.id) {
      <div class="category-row">
        <div class="category-main">
          <div class="category-icon-box" [style.backgroundColor]="category.color">
            <mat-icon>{{ category.icon }}</mat-icon>
          </div>
          <span class="category-name">{{ category.name }}</span>
          @if (category.isProtected) {
            <app-badge tone="primary" icon="lock">Protected</app-badge>
          } @else if (category.isDefault) {
            <app-badge>Default</app-badge>
          }
        </div>

        <div class="category-actions">
          <button
            mat-icon-button
            type="button"
            matTooltip="Edit category"
            aria-label="Edit category"
            (click)="openEditCategoryDialog(category)"
            class="edit-button"
          >
            <mat-icon>edit</mat-icon>
          </button>

          @if (category.isProtected) {
            <button
              mat-icon-button
              type="button"
              disabled
              matTooltip="Protected general category cannot be deleted"
              aria-label="Protected category cannot be deleted"
              class="delete-button"
            >
              <mat-icon>lock</mat-icon>
            </button>
          } @else {
            <button
              mat-icon-button
              type="button"
              matTooltip="Delete category and reassign items to General"
              aria-label="Delete category"
              (click)="confirmDeleteCategory(category)"
              class="delete-button"
            >
              <mat-icon>delete</mat-icon>
            </button>
          }
        </div>
      </div>
    }
  </div>
</div>

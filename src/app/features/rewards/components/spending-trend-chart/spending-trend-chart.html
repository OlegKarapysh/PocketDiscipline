<div class="trend-chart-container">
  <div class="chart-header">
    @if (hoveredPoint(); as hovered) {
      <div class="hover-info">
        <span class="hover-label">{{ hovered.label }}:</span>
        <app-amount class="hover-amount" size="sm" [value]="hovered.amount" />
      </div>
    } @else {
      <div class="hover-placeholder">Hover over a bar to view spending details</div>
    }
  </div>

  <div class="svg-wrapper" (appObserveWidth)="width.set($event)">
    <svg [attr.viewBox]="viewBox()" preserveAspectRatio="xMidYMid meet" class="trend-svg">
      @for (line of gridLines(); track line.y) {
        <line
          [attr.x1]="marginLeft()"
          [attr.y1]="line.y"
          [attr.x2]="marginLeft() + plotWidth()"
          [attr.y2]="line.y"
          class="grid-line"
        />
        <text [attr.x]="yAxisTextX()" [attr.y]="line.y + 4" text-anchor="end" class="axis-label pd-num">
          {{ line.label }}
        </text>
      }

      @for (bar of bars(); track bar.point.dateOrMonth) {
        <rect
          [attr.x]="bar.x"
          [attr.y]="bar.y"
          [attr.width]="bar.width"
          [attr.height]="bar.height"
          rx="3"
          ry="3"
          class="trend-bar"
          [class.has-amount]="bar.point.amount > 0"
          [class.hovered]="hoveredPoint() === bar.point"
          (mouseenter)="setHovered(bar.point)"
          (mouseleave)="setHovered(null)"
        />

        @if (bar.showLabel) {
          <text
            [attr.x]="bar.x + bar.width / 2"
            [attr.y]="marginTop + plotHeight + 18"
            text-anchor="middle"
            class="axis-label pd-num"
          >
            {{ bar.point.label }}
          </text>
        }
      }
    </svg>
  </div>
</div>

<div class="store-container">
  <div class="store-toolbar">
    <app-segmented-control
      class="status-toggle"
      ariaLabel="Filter rewards by status"
      [options]="statusOptions()"
      [(value)]="statusFilter"
    />

    <div class="filter-controls">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-field">
        <mat-icon matPrefix>search</mat-icon>
        <input matInput type="text" placeholder="Search rewards" [formField]="filterForm.query" />
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="category-field">
        <mat-label>Category</mat-label>
        <mat-select [formField]="filterForm.categoryId">
          <mat-option value="all">All categories</mat-option>
          @for (cat of categories(); track cat.id) {
            <mat-option [value]="cat.id">
              <mat-icon [style.color]="cat.color">{{ cat.icon }}</mat-icon>
              <span>{{ cat.name }}</span>
            </mat-option>
          }
        </mat-select>
      </mat-form-field>

      <button mat-flat-button class="add-reward-btn" type="button" (click)="openAddReward()">
        <mat-icon>add</mat-icon>
        Add reward
      </button>
    </div>
  </div>

  @if (rewardRows().length > 0) {
    <div class="rewards-grid">
      @for (row of rewardRows(); track row.reward.id) {
        <app-reward-card
          [reward]="row.reward"
          [category]="row.category"
          [currentBalance]="balance()"
          [claiming]="row.isClaiming"
          (claim)="onClaimReward($event)"
          (edit)="onEditReward($event)"
          (delete)="onDeleteReward($event)"
        />
      }
    </div>
  } @else if (statusFilter() === 'active') {
    <app-empty-state
      class="empty-state"
      heading="No rewards found"
      message="Create a custom reward to start saving toward milestones and treats."
      actionLabel="Create first reward"
      (action)="openAddReward()"
    />
  } @else {
    <app-empty-state
      class="empty-state"
      heading="No rewards found"
      message="You haven't claimed any milestone rewards yet. Keep building discipline."
    />
  }
</div>

<div class="donut-chart-container">
  <div class="chart-visual">
    <svg viewBox="0 0 200 200" class="donut-svg">
      <circle cx="100" cy="100" r="70" fill="transparent" stroke-width="20" class="donut-track" />

      @for (slice of slices(); track slice.category.categoryId) {
        <circle
          cx="100"
          cy="100"
          r="70"
          fill="transparent"
          [attr.stroke]="slice.category.color"
          stroke-width="20"
          [attr.stroke-dasharray]="slice.dashArray"
          [attr.stroke-dashoffset]="slice.dashOffset"
          transform="rotate(-90 100 100)"
          class="donut-segment"
          [class.hovered]="hoveredCategoryId() === slice.category.categoryId"
          (mouseenter)="setHovered(slice.category.categoryId)"
          (mouseleave)="setHovered(null)"
        />
      }

      <g class="center-text">
        @if (activeCategory(); as active) {
          <text x="100" y="93" text-anchor="middle" class="center-label">{{ active.categoryName }}</text>
          <text x="100" y="115" text-anchor="middle" class="center-value pd-num">{{ active.totalSpent | money }}</text>
          <text x="100" y="130" text-anchor="middle" class="center-sub pd-num">{{ active.percentage }}%</text>
        } @else {
          <text x="100" y="95" text-anchor="middle" class="center-label">Total spent</text>
          <text x="100" y="120" text-anchor="middle" class="center-value pd-num">{{ totalSpent() | money }}</text>
        }
      </g>
    </svg>
  </div>

  <div class="chart-legend">
    @for (item of data(); track item.categoryId) {
      <div
        class="legend-item"
        [class.highlighted]="hoveredCategoryId() === item.categoryId"
        (mouseenter)="setHovered(item.categoryId)"
        (mouseleave)="setHovered(null)"
      >
        <div class="legend-swatch" [style.backgroundColor]="item.color">
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
        </div>
        <div class="legend-info">
          <span class="legend-name">{{ item.categoryName }}</span>
          <span class="legend-percent pd-num">{{ item.percentage }}%</span>
        </div>
        <app-amount class="legend-amount" size="sm" [value]="item.totalSpent" />
      </div>
    }
  </div>
</div>

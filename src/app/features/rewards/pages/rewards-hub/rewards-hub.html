<app-page-header title="Rewards">
  <button pageActions mat-flat-button type="button" (click)="openQuickSpend()" class="quick-spend-action-button">
    <mat-icon>payments</mat-icon>
    Quick spend
  </button>
</app-page-header>

<mat-tab-group animationDuration="200ms" class="hub-tabs">
  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon class="tab-icon">storefront</mat-icon>
      Reward store
    </ng-template>
    <div class="tab-content">
      <app-reward-store />
    </div>
  </mat-tab>

  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon class="tab-icon">receipt_long</mat-icon>
      History
    </ng-template>
    <div class="tab-content">
      <app-withdrawal-ledger />
    </div>
  </mat-tab>

  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon class="tab-icon">insights</mat-icon>
      Analytics
    </ng-template>
    <div class="tab-content">
      <app-spending-analytics />
    </div>
  </mat-tab>
</mat-tab-group>

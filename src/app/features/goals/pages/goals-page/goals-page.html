<app-page-header title="Goals">
  <button pageActions mat-flat-button type="button" (click)="openAddDialog()"><mat-icon>add</mat-icon> Add goal</button>
</app-page-header>

<app-goal-list
  [activeGoals]="activeGoals()"
  [completedGoals]="completedGoals()"
  (complete)="completeGoal($event)"
  (undo)="undoCompleteGoal($event)"
  (edit)="openEditDialog($event)"
  (delete)="deleteGoal($event)"
/>

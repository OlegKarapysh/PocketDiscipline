<mat-card appearance="outlined" class="goal-card" [class.completed]="isCompleted()">
  <mat-card-header>
    <mat-card-title class="title">{{ goal().title }}</mat-card-title>
    <mat-card-subtitle class="reward">
      Reward <app-amount [value]="goal().rewardValue" size="sm" tone="reward" [showSign]="true" />
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-actions align="end" class="actions">
    @if (isActive()) {
      <button mat-icon-button type="button" (click)="edit.emit(goal())" aria-label="Edit">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button type="button" class="delete" (click)="delete.emit(goal().id)" aria-label="Delete">
        <mat-icon>delete</mat-icon>
      </button>
      <button mat-flat-button type="button" class="complete" (click)="complete.emit(goal().id)">
        <mat-icon>check</mat-icon> Complete
      </button>
    } @else {
      <button mat-stroked-button type="button" (click)="undo.emit(goal().id)"><mat-icon>undo</mat-icon> Undo</button>
    }
  </mat-card-actions>
</mat-card>

<h2 mat-dialog-title>{{ data.goal ? 'Edit goal' : 'New goal' }}</h2>
<mat-dialog-content>
  <form class="fields" [formRoot]="goalForm" (submit)="onSubmit()">
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput [formField]="goalForm.title" placeholder="e.g. Read a book" />
      @for (error of goalForm.title().errors(); track error.kind) {
        <mat-error>{{ error.message }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Reward (₴)</mat-label>
      <input matInput type="number" step="1" [formField]="goalForm.rewardValue" />
      @for (error of goalForm.rewardValue().errors(); track error.kind) {
        <mat-error>{{ error.message }}</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancel</button>
  <button mat-flat-button type="button" class="save" [disabled]="goalForm().invalid()" (click)="onSubmit()">
    Save
  </button>
</mat-dialog-actions>

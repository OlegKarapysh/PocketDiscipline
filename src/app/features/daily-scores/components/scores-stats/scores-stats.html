<div class="stats-container">
  <app-stat-card [label]="averageLabel()">
    <span class="stat-value" [class.no-data]="averageScore() === 0">
      {{ averageScore() > 0 ? averageScore() : '-' }}
    </span>
  </app-stat-card>

  <app-stat-card label="Current streak" hint="Days scoring 9 or 10">
    <span class="stat-value streak" [class.active]="currentStreak() > 0">{{ currentStreak() }}</span>
  </app-stat-card>
</div>

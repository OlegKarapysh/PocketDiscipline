<app-page-header title="Daily scores" />

@if (loading()) {
  <div class="loading-container">
    <mat-spinner diameter="40" />
  </div>
} @else {
  <div class="page-grid">
    @if (successMessage()) {
      <div class="success-message" role="status">
        {{ successMessage() }}
      </div>
    }

    <app-scores-stats class="full-row" [monthlyScores]="monthlyScores()" [latestScore]="latestScore()" />

    <app-score-input
      [readonly]="hasScoreToday()"
      [selectedScore]="currentScore()"
      (scoreSubmitted)="onScoreSubmit($event)"
    />

    <app-scores-chart [scores]="weeklyScores()" />
  </div>
}

<app-page-header title="Daily scores" />

@if (loading()) {
  <div class="loading-container">
    <mat-spinner diameter="40" />
  </div>
} @else {
  <div class="page-grid">
    @if (successMessage()) {
      <div class="success-message" role="status">
        {{ successMessage() }}
      </div>
    }

    <app-scores-stats [scores]="periodScores()" [periodLabel]="periodLabel()" [latestScore]="latestScore()" />

    <app-score-input
      [readonly]="hasScoreToday()"
      [selectedScore]="currentScore()"
      (scoreSubmitted)="onScoreSubmit($event)"
    />

    <div class="scores-history">
      <app-period-filter
        ariaLabel="Daily scores period"
        [filter]="currentFilter()"
        (filterChange)="onFilterChange($event)"
      />

      <app-scores-chart
        [scores]="periodScores()"
        [startDate]="currentFilter().startDate"
        [endDate]="currentFilter().endDate"
      />
    </div>
  </div>
}

<mat-card appearance="outlined" class="card">
  <mat-card-header>
    <mat-card-title class="card-title">Your tasks</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (tasks(); as tasks) {
      @if (tasks.length > 0) {
        <mat-list>
          @for (task of tasks; track task.id) {
            <mat-list-item [class.completed]="task.isCompleted">
              <mat-checkbox
                [checked]="task.isCompleted"
                [disabled]="task.isCompleted"
                (change)="completeTask(task)"
                matListItemTitle
              >
                <span class="task-title" [class.strike]="task.isCompleted">{{ task.title }}</span>
              </mat-checkbox>
              <span matListItemLine class="task-meta">
                <mat-chip-set>
                  <mat-chip class="reward-chip">
                    <app-amount [value]="task.rewardValue" size="sm" tone="reward" [showSign]="true" />
                  </mat-chip>
                  <mat-chip class="type-chip">{{ task.type }}</mat-chip>
                </mat-chip-set>
              </span>
            </mat-list-item>
          }
        </mat-list>
      } @else {
        <app-empty-state
          class="empty-state"
          heading="You have no tasks yet"
          actionLabel="Add initial tasks"
          (action)="addDummyTask()"
        />
      }
    }
  </mat-card-content>
</mat-card>

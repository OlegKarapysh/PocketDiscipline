<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Your Tasks</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (tasks$ | async; as tasks) {
      @if (tasks.length > 0) {
        <mat-list>
          @for (task of tasks; track task) {
            <mat-list-item [class.completed]="task.isCompleted">
              <mat-checkbox
                [checked]="task.isCompleted"
                [disabled]="task.isCompleted"
                (change)="completeTask(task)"
                matListItemTitle
              >
                <span class="task-title" [class.strike]="task.isCompleted">{{ task.title }}</span>
              </mat-checkbox>
              <span matListItemLine class="task-meta">
                <mat-chip-set>
                  <mat-chip class="reward-chip">+{{ task.rewardValue }} ₴</mat-chip>
                  <mat-chip class="type-chip">{{ task.type }}</mat-chip>
                </mat-chip-set>
              </span>
            </mat-list-item>
          }
        </mat-list>
      } @else {
        <div class="empty-state">
          <mat-icon class="empty-icon">check_circle_outline</mat-icon>
          <p>You have no tasks yet.</p>
          <button mat-raised-button color="primary" (click)="addDummyTask()">Add Initial Tasks</button>
        </div>
      }
    }
  </mat-card-content>
</mat-card>

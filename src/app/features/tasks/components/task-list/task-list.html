<mat-card appearance="outlined" class="card">
  <mat-card-header>
    <mat-card-title class="card-title">Your tasks</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (tasks(); as tasks) {
      @if (tasks.length > 0) {
        <ul class="task-rows">
          @for (task of tasks; track task.id) {
            <li class="task-row" [class.completed]="task.isCompleted">
              <mat-checkbox [checked]="task.isCompleted" [disabled]="task.isCompleted" (change)="completeTask(task)">
                <span class="task-title" [class.strike]="task.isCompleted">{{ task.title }}</span>
              </mat-checkbox>
              <div class="task-meta">
                <app-amount class="reward" [value]="task.rewardValue" size="sm" tone="reward" [showSign]="true" />
                <app-badge>{{ task.type }}</app-badge>
              </div>
            </li>
          }
        </ul>
      } @else {
        <app-empty-state
          class="empty-state"
          heading="You have no tasks yet"
          actionLabel="Add initial tasks"
          (action)="addDummyTask()"
        />
      }
    }
  </mat-card-content>
</mat-card>

<mat-card class="balance-card">
  <div class="balance-info">
    <span class="label">Current balance</span>
    <app-amount [value]="user()?.balance" size="xl" tone="inherit" />
  </div>
  <button mat-flat-button class="quick-spend-btn" type="button" (click)="openQuickSpend()">
    <mat-icon>shopping_bag</mat-icon>
    Quick spend
  </button>
</mat-card>

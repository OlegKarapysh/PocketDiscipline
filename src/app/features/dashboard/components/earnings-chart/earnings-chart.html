<app-section-card heading="Daily earnings">
  <div class="chart-content">
    <div class="legend-container">
      @for (item of legendItems; track item.source) {
        <div class="legend-item">
          <span class="swatch" [attr.data-source]="item.source"></span>
          <span>{{ item.label }}</span>
        </div>
      }
    </div>

    <div class="svg-container" (appObserveWidth)="width.set($event)">
      <svg
        [attr.viewBox]="viewBox()"
        class="earnings-svg"
        preserveAspectRatio="xMidYMid meet"
        role="region"
        aria-label="Daily earnings chart"
      >
        <!-- Horizontal Grid Lines and Labels -->
        @for (line of gridLines(); track line.y) {
          <line
            [attr.x1]="chartLeftX()"
            [attr.y1]="line.y"
            [attr.x2]="chartRightX()"
            [attr.y2]="line.y"
            class="grid-line"
          />
          <text
            [attr.x]="yAxisTextX()"
            [attr.y]="line.y + axisLabelYOffset"
            class="axis-label pd-num"
            text-anchor="end"
          >
            {{ line.label }}
          </text>
        }

        <!-- Baseline -->
        <line
          [attr.x1]="chartLeftX()"
          [attr.y1]="chartBaselineY"
          [attr.x2]="chartRightX()"
          [attr.y2]="chartBaselineY"
          class="baseline"
        />

        <!-- Bars -->
        @for (bar of bars(); track bar.date) {
          <g
            class="chart-bar-group"
            (mouseenter)="onBarMouseEnter(bar.record, $event)"
            (mousemove)="onBarMouseMove($event)"
            (mouseleave)="onBarMouseLeave()"
            (click)="onBarClick(bar.record, $event)"
            (focus)="onBarFocus(bar.record, $event)"
            (blur)="onBarBlur()"
            tabindex="0"
            [attr.aria-label]="bar.date + ': ' + (bar.total | money)"
          >
            <!-- Invisible hit target for smooth hover/touch -->
            <rect
              [attr.x]="bar.x"
              [attr.y]="chartTopY"
              [attr.width]="bar.width"
              [attr.height]="chartHeight"
              class="bar-hitbox"
            />

            <!-- Zero earnings indicator line on baseline -->
            @if (bar.total === 0) {
              <rect
                [attr.x]="bar.x"
                [attr.y]="zeroBarY"
                [attr.width]="bar.width"
                [attr.height]="zeroBarHeight"
                class="zero-bar"
              />
            }

            <!-- Stacked Segments -->
            @for (seg of bar.segments; track seg.source) {
              <rect
                [attr.x]="bar.x"
                [attr.y]="seg.y"
                [attr.width]="bar.width"
                [attr.height]="seg.height"
                [attr.data-source]="seg.source"
                class="bar-segment"
              />
            }

            <!-- X-Axis Label -->
            @if (bar.shouldShowLabel) {
              <text
                [attr.x]="bar.x + bar.width / 2"
                [attr.y]="axisLabelYPos"
                class="axis-label pd-num"
                text-anchor="middle"
              >
                {{ bar.formattedDate }}
              </text>
            }
          </g>
        }
      </svg>
    </div>

    <!-- Floating Tooltip -->
    @if (hoveredRecord(); as record) {
      <div class="chart-tooltip" [style.left.px]="tooltipPosition()?.x" [style.top.px]="tooltipPosition()?.y">
        <div class="tooltip-date pd-num">{{ record.date }}</div>
        <div class="tooltip-row tooltip-total">
          <span>Total</span>
          <app-amount [value]="record.totalEarned" size="sm" tone="inherit" />
        </div>
        @for (row of tooltipBreakdown(); track row.source) {
          <div class="tooltip-row">
            <span class="swatch" [attr.data-source]="row.source"></span>
            <span class="row-label">{{ row.label }}</span>
            <app-amount [value]="row.amount" size="sm" tone="inherit" />
          </div>
        } @empty {
          <div class="no-earnings-text">No earnings recorded</div>
        }
      </div>
    }
  </div>
</app-section-card>

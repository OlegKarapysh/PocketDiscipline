<div class="month-navigation">
  <button mat-icon-button type="button" aria-label="Previous month" (click)="goToPreviousMonth()">
    <mat-icon>chevron_left</mat-icon>
  </button>

  <h2 class="month-label">{{ summary()?.monthLabel ?? 'Monthly statistics' }}</h2>

  <button mat-icon-button type="button" aria-label="Next month" [disabled]="isNextDisabled()" (click)="goToNextMonth()">
    <mat-icon>chevron_right</mat-icon>
  </button>
</div>

@if (summary(); as s) {
  @if (hasNoEarnings()) {
    <app-badge class="empty-earnings-indicator" icon="info">No earnings recorded for this month</app-badge>
  }

  <div class="stats">
    <app-stat-card label="Daily average" [hint]="averageHint()">
      <app-amount [value]="s.averageEarnedPerDay" unit="₴/day" />
    </app-stat-card>
    <app-stat-card label="Total earned">
      <app-amount [value]="s.totalEarned" />
    </app-stat-card>
  </div>
}

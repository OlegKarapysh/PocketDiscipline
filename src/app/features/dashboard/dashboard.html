<app-page-header title="Today" />

<div class="dashboard">
  <app-balance-widget class="balance" />

  <app-earnings-stats class="month-stats" [summary]="monthlySummary()" (monthChange)="onMonthChange($event)" />

  <div class="earnings">
    <app-earnings-filter [filter]="currentFilter()" (filterChange)="onFilterChange($event)" />

    <app-earnings-chart [records]="dailyEarnings()" />
  </div>
</div>

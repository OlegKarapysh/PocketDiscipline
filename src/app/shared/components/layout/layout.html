<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" class="rail" [opened]="!isCompact()">
    <div class="brand">
      <img src="icons/icon-96x96.png" alt="" width="30" height="30" />
      <span>PocketDiscipline</span>
    </div>
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive #rla="routerLinkActive" [activated]="rla.isActive">
          <mat-icon matListItemIcon [class.pd-icon-filled]="rla.isActive">{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content class="main">
    <div class="scroller">
      <main class="content">
        <router-outlet />
      </main>
    </div>
    @if (isCompact()) {
      <app-speed-dial class="speed-dial" [actions]="quickActions" />
      <app-bottom-nav [items]="primaryNav" [moreItems]="moreNav" />
    }
  </mat-sidenav-content>
</mat-sidenav-container>
